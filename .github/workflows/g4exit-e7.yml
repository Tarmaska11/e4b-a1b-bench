name: g4exit-e7
# E7: closed-form structure tests for rebuilding E4B's FFN as a routed block (one layer per job) and the LM-head
# sketch test. Starts when g4exit/RUN_E7 changes on a fable/** branch. 7 parallel jobs at most.
on:
  push:
    branches: ['fable/**']
    paths: ['g4exit/RUN_E7']
permissions:
  contents: write
env:
  LLAMA_TAG: b11235
  E4B_URL: https://huggingface.co/unsloth/gemma-4-E4B-it-GGUF/resolve/main/gemma-4-E4B-it-Q4_K_M.gguf
jobs:
  e7:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        what: ['head', 'L6', 'L13', 'L16', 'L20', 'L26', 'L34']
    steps:
      - uses: actions/checkout@v4
      - name: build g4dump
        run: |
          set -e
          git clone --depth 1 --branch $LLAMA_TAG https://github.com/ggml-org/llama.cpp src
          python3 g4exit/patch_gemma4.py src
          mkdir src/examples/g4dump && cp g4exit/g4dump.cpp src/examples/g4dump/
          sed -e 's/llama-eval-callback/g4dump/' -e 's/eval-callback.cpp/g4dump.cpp/' -e '/LLAMA_BUILD_TESTS/,$d' \
              src/examples/eval-callback/CMakeLists.txt > src/examples/g4dump/CMakeLists.txt
          echo 'add_subdirectory(g4dump)' >> src/examples/CMakeLists.txt
          cmake -S src -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DLLAMA_CURL=OFF \
                -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_SERVER=OFF -DLLAMA_BUILD_TOOLS=OFF -DLLAMA_BUILD_EXAMPLES=ON \
                -DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON
          cmake --build build --target g4dump -j 4
          mkdir bin && cp "$(find build -name g4dump -type f | head -1)" bin/g4dump
      - name: model
        run: |
          curl -sSL -o model.gguf "$E4B_URL" && ls -la model.gguf
          pip install -q numpy gguf
          free -g && nproc && df -h . | tail -1
      - name: E7
        run: |
          W=${{ matrix.what }}
          if [ "$W" = head ]; then
            python3 g4exit/e7_head.py --g4dump bin/g4dump --model model.gguf --out e7_out
          else
            python3 g4exit/e7_struct.py --g4dump bin/g4dump --model model.gguf --layer ${W#L} --out e7_out
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4exit-e7-${{ matrix.what }}
          path: |
            e7_out/report_e7_*.md
            e7_out/results_e7_*.json
            e7_out/dump_*.log
          retention-days: 30
      - name: commit the report
        if: always()
        run: |
          set -e
          D=g4exit/results/e7-${{ github.run_id }}
          mkdir -p $D
          cp e7_out/report_e7_*.md e7_out/results_e7_*.json $D/ || true
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add g4exit/results
          git commit -m "E7 results (${{ matrix.what }}), run ${{ github.run_id }}" || exit 0
          for i in 1 2 3 4 5 6 7 8; do
            git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break
            sleep $((5 + RANDOM % 20))
          done
