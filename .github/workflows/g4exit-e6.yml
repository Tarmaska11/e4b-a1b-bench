name: g4exit-e6
# E6: Gemma 4 26B-A4B (Google's MoE, same family as E4B) at Q2_K_XL on the same harness.
on:
  push:
    branches: ['fable/**']
    paths: ['g4exit/RUN_E6']
permissions:
  contents: write
env:
  LLAMA_TAG: b12317
jobs:
  mc:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        model:
          - { tag: gemma4-26b-a4b-q2kxl, repo: unsloth/gemma-4-26B-A4B-it-GGUF, file: gemma-4-26B-A4B-it-UD-Q2_K_XL.gguf, n: 4 }
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: llama.cpp (CPU, prebuilt) + model
        run: |
          set -e
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -1
          curl -sSL -o llama.tar.gz https://github.com/ggml-org/llama.cpp/releases/download/$LLAMA_TAG/llama-$LLAMA_TAG-bin-ubuntu-x64.tar.gz
          mkdir llama && tar -xzf llama.tar.gz -C llama
          curl -sSL -o model.gguf "https://huggingface.co/${{ matrix.model.repo }}/resolve/main/${{ matrix.model.file }}"
          ls -la model.gguf
      - name: benchmark shard
        run: |
          SRV=$(find llama -name 'llama-server' -type f | head -1)
          python3 bench/llamacpp_mc.py --server "$SRV" --model model.gguf --data data/bench_gmmlu.jsonl \
            --shard ${{ matrix.shard }} --nshards 4 --out out_${{ matrix.model.tag }}_${{ matrix.shard }}.jsonl
      - name: chat samples (EN + RU, for reading)
        if: matrix.shard < 2
        run: |
          SRV=$(find llama -name 'llama-server' -type f | head -1)
          python3 g4exit/chat_sample.py --server "$SRV" --model model.gguf --shard ${{ matrix.shard }} --nshards 4 \
            --temp 0.7 --top-p 0.9 --top-k 40 --out chat_${{ matrix.model.tag }}_${{ matrix.shard }}.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e6-${{ matrix.model.tag }}-${{ matrix.shard }}
          path: |
            out_*.jsonl
            chat_*.jsonl
            server_*.log
          retention-days: 30

  report:
    needs: mc
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: e6-*
          path: res
          merge-multiple: true
      - name: score and commit
        run: |
          set -e
          D=g4exit/results/e6-${{ github.run_id }}
          mkdir -p $D
          ARGS="e4b-q4km=g4exit/ref/e4b_q4km.jsonl"
          for t in gemma4-26b-a4b-q2kxl; do
            if ls res/out_${t}_*.jsonl >/dev/null 2>&1; then
              cat res/out_${t}_*.jsonl > $D/out_$t.jsonl
              ARGS="$ARGS $t=$D/out_$t.jsonl"
            fi
            if ls res/chat_${t}_*.jsonl >/dev/null 2>&1; then cat res/chat_${t}_*.jsonl > $D/chat_$t.jsonl; fi
          done
          python3 bench/score_mc.py $ARGS --ref e4b-q4km | tee $D/score.txt
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add g4exit/results
          git commit -m "E6 results, run ${{ github.run_id }}" || exit 0
          for i in 1 2 3 4 5 6; do
            git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break
            sleep $((RANDOM % 20 + 5))
          done
